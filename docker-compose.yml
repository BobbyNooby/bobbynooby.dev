services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - PUBLIC_WEBSOCKET_BASE_URL=${PUBLIC_WEBSOCKET_BASE_URL:-}
    env_file:
      - path: .env
        required: false
    environment:
      - IS_PRODUCTION=${IS_PRODUCTION:-false}

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - IS_PRODUCTION=${IS_PRODUCTION:-false}
